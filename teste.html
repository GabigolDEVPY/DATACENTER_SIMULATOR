<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foguete para a Lua</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: Arial, sans-serif; color: #fff; }
    #ui {
      position: absolute; top: 16px; left: 16px;
      background: rgba(0, 20, 40, 0.8); padding: 14px 18px;
      border-radius: 10px; border: 1px solid #0af;
      font-size: 15px; line-height: 1.6; pointer-events: none;
    }
    #ui span { color: #0f8; font-weight: bold; }
    #instructions {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.75); padding: 10px 20px; border-radius: 8px;
      font-size: 13px; text-align: center; white-space: nowrap;
    }
    #message {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      font-size: 26px; font-weight: bold; text-align: center;
      background: rgba(0,0,0,0.85); padding: 20px 40px; border-radius: 12px;
      display: none;
    }
    #error {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #f66; font-size: 18px; text-align: center; display: none;
    }
  </style>
</head>
<body>
  <div id="ui">
    Velocidade: <span id="speed">0</span><br>
    Altitude Terra: <span id="alt">0</span><br>
    Distância Lua: <span id="dist">0</span><br>
    Combustível: <span id="fuel">100</span>%
  </div>
  <div id="instructions">
    W/S = Inclinar &nbsp;|&nbsp; A/D = Girar &nbsp;|&nbsp; Q/E = Rolar &nbsp;|&nbsp; ESPAÇO = Impulsão &nbsp;|&nbsp; SHIFT = Turbo &nbsp;|&nbsp; R = Reiniciar
  </div>
  <div id="message"></div>
  <div id="error">Seu navegador não suporta WebGL.<br>Use Chrome ou Firefox.</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Verifica WebGL
    function hasWebGL() {
      try {
        const canvas = document.createElement('canvas');
        return !!(window.WebGLRenderingContext && (canvas.getContext('webgl') || canvas.getContext('experimental-webgl')));
      } catch (e) { return false; }
    }

    if (!hasWebGL()) {
      document.getElementById('error').style.display = 'block';
    } else {
      startGame();
    }

    function startGame() {
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x000011);

      const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 3000);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      // Estrelas
      const starsGeo = new THREE.BufferGeometry();
      const positions = new Float32Array(5000 * 3);
      for (let i = 0; i < positions.length; i++) positions[i] = (Math.random() - 0.5) * 2800;
      starsGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      scene.add(new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.4 })));

      // Luzes
      scene.add(new THREE.AmbientLight(0x404060, 0.9));
      const sun = new THREE.DirectionalLight(0xffffff, 1.3);
      sun.position.set(120, 60, 80);
      scene.add(sun);

      // ===== TERRA =====
      const EARTH_R = 30;
      const earth = new THREE.Mesh(
        new THREE.SphereGeometry(EARTH_R, 64, 64),
        new THREE.MeshStandardMaterial({ color: 0x1a6fb5, roughness: 0.7 })
      );
      scene.add(earth);

      // Atmosfera
      scene.add(new THREE.Mesh(
        new THREE.SphereGeometry(EARTH_R + 1.6, 32, 32),
        new THREE.MeshBasicMaterial({ color: 0x66b3ff, transparent: true, opacity: 0.2, side: THREE.BackSide })
      ));

      // ===== LUA =====
      const MOON_R = 10;
      const moon = new THREE.Mesh(
        new THREE.SphereGeometry(MOON_R, 48, 48),
        new THREE.MeshStandardMaterial({ color: 0xb0b0b0, roughness: 0.95 })
      );
      moon.position.set(180, 15, -40);
      scene.add(moon);

      // ===== BASE =====
      const base = new THREE.Group();
      const pad = new THREE.Mesh(
        new THREE.CylinderGeometry(4, 4.5, 0.8, 20),
        new THREE.MeshStandardMaterial({ color: 0x555555 })
      );
      pad.position.y = EARTH_R + 0.4;
      base.add(pad);

      const tower = new THREE.Mesh(
        new THREE.BoxGeometry(0.5, 10, 0.5),
        new THREE.MeshStandardMaterial({ color: 0x888888 })
      );
      tower.position.set(3.2, EARTH_R + 5, 0);
      base.add(tower);
      scene.add(base);

      // ===== FOGUETE =====
      const rocket = new THREE.Group();

      // Corpo
      rocket.add(new THREE.Mesh(
        new THREE.CylinderGeometry(0.5, 0.6, 3.5, 16),
        new THREE.MeshStandardMaterial({ color: 0xf0f0f0, metalness: 0.3 })
      )).position.y = 1.75;

      // Bico
      const nose = new THREE.Mesh(
        new THREE.ConeGeometry(0.5, 1.3, 16),
        new THREE.MeshStandardMaterial({ color: 0xe63939 })
      );
      nose.position.y = 4.05;
      rocket.add(nose);

      // Janela
      const windowMesh = new THREE.Mesh(
        new THREE.SphereGeometry(0.28, 16, 16),
        new THREE.MeshStandardMaterial({ color: 0x88ddff, emissive: 0x226688 })
      );
      windowMesh.position.set(0, 3.0, 0.45);
      rocket.add(windowMesh);

      // Aletas
      const finMat = new THREE.MeshStandardMaterial({ color: 0xcc2222 });
      for (let i = 0; i < 3; i++) {
        const fin = new THREE.Mesh(new THREE.BoxGeometry(0.18, 1.4, 0.9), finMat);
        const a = (i / 3) * Math.PI * 2;
        fin.position.set(Math.sin(a) * 0.58, 0.7, Math.cos(a) * 0.58);
        fin.rotation.y = a;
        rocket.add(fin);
      }

      // Motor + chama
      const engine = new THREE.Mesh(
        new THREE.CylinderGeometry(0.4, 0.55, 0.7, 16),
        new THREE.MeshStandardMaterial({ color: 0x333333 })
      );
      engine.position.y = -0.15;
      rocket.add(engine);

      const flame = new THREE.Mesh(
        new THREE.ConeGeometry(0.4, 1.8, 16),
        new THREE.MeshBasicMaterial({ color: 0xff5500, transparent: true, opacity: 0.9 })
      );
      flame.rotation.x = Math.PI;
      flame.position.y = -1.2;
      flame.visible = false;
      rocket.add(flame);

      // Posição inicial
      rocket.position.set(0, EARTH_R + 2.5, 0);
      scene.add(rocket);

      // Física
      let velocity = new THREE.Vector3();
      let fuel = 100;
      let landed = false;
      let crashed = false;

      const keys = {};
      window.addEventListener('keydown', e => {
        keys[e.code] = true;
        if (e.code === 'KeyR') location.reload();
      });
      window.addEventListener('keyup', e => keys[e.code] = false);

      // Câmera inicial (importante!)
      camera.position.set(0, EARTH_R + 9, -15);
      camera.lookAt(rocket.position);

      const speedEl = document.getElementById('speed');
      const altEl = document.getElementById('alt');
      const distEl = document.getElementById('dist');
      const fuelEl = document.getElementById('fuel');
      const msgEl = document.getElementById('message');

      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.033);

        if (!landed && !crashed) {
          // Rotação
          const rs = 2.0 * dt;
          if (keys['KeyW']) rocket.rotateX(-rs);
          if (keys['KeyS']) rocket.rotateX(rs);
          if (keys['KeyA']) rocket.rotateY(rs);
          if (keys['KeyD']) rocket.rotateY(-rs);
          if (keys['KeyQ']) rocket.rotateZ(rs);
          if (keys['KeyE']) rocket.rotateZ(-rs);

          // Impulsão
          let thrust = 0;
          if (keys['Space'] && fuel > 0) { thrust = 22; fuel -= 5 * dt; }
          if ((keys['ShiftLeft'] || keys['ShiftRight']) && fuel > 0) { thrust = 45; fuel -= 11 * dt; }
          fuel = Math.max(0, fuel);
          flame.visible = thrust > 0;

          if (thrust > 0) {
            const dir = new THREE.Vector3(0, 1, 0).applyQuaternion(rocket.quaternion);
            velocity.addScaledVector(dir, thrust * dt);
          }

          // Gravidade Terra
          const toEarth = earth.position.clone().sub(rocket.position);
          const dEarth = toEarth.length();
          if (dEarth > EARTH_R + 1) {
            velocity.addScaledVector(toEarth.normalize(), (12 / (dEarth * dEarth)) * 40 * dt);
          }

          // Gravidade Lua
          const toMoon = moon.position.clone().sub(rocket.position);
          const dMoon = toMoon.length();
          if (dMoon > MOON_R + 1) {
            velocity.addScaledVector(toMoon.normalize(), (4.5 / (dMoon * dMoon)) * 40 * dt);
          }

          velocity.multiplyScalar(0.9985);
          rocket.position.addScaledVector(velocity, dt);

          // Colisão Terra
          if (dEarth < EARTH_R + 2.2) {
            const n = toEarth.normalize();
            rocket.position.copy(earth.position).addScaledVector(n, -(EARTH_R + 2.2));
            if (velocity.dot(n) > 0) velocity.projectOnPlane(n).multiplyScalar(0.3);
          }

          // Colisão / pouso Lua
          if (dMoon < MOON_R + 2.3) {
            const speed = velocity.length();
            const n = toMoon.normalize();
            if (speed < 5) {
              rocket.position.copy(moon.position).addScaledVector(n, -(MOON_R + 2.2));
              velocity.set(0, 0, 0);
              landed = true;
              flame.visible = false;
              msgEl.innerHTML = 'POUSO CONCLUÍDO!<br><small>Você chegou na Lua</small>';
              msgEl.style.color = '#0f0';
              msgEl.style.display = 'block';
            } else {
              rocket.position.copy(moon.position).addScaledVector(n, -(MOON_R + 2.4));
              velocity.multiplyScalar(0.2);
              if (speed > 12) {
                crashed = true;
                msgEl.innerHTML = 'COLISÃO!<br><small>Pressione R para tentar de novo</small>';
                msgEl.style.color = '#f44';
                msgEl.style.display = 'block';
              }
            }
          }
        }

        // Câmera segue
        const offset = new THREE.Vector3(0, 4, -11).applyQuaternion(rocket.quaternion);
        camera.position.lerp(rocket.position.clone().add(offset), 0.07);
        camera.lookAt(rocket.position.clone().add(new THREE.Vector3(0, 1.5, 0).applyQuaternion(rocket.quaternion)));

        // UI
        speedEl.textContent = velocity.length().toFixed(1);
        altEl.textContent = Math.max(0, rocket.position.distanceTo(earth.position) - EARTH_R).toFixed(1);
        distEl.textContent = Math.max(0, rocket.position.distanceTo(moon.position) - MOON_R).toFixed(1);
        fuelEl.textContent = Math.floor(fuel);

        earth.rotation.y += 0.0006;
        moon.rotation.y += 0.0015;

        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }
  </script>
</body>
</html>
