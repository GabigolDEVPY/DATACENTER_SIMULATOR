<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
        <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
        body {
            background: #0b0e14;
            color: #c8d6e5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .register-card {
            border-radius: 16px;
            background: #141a24;
            border: 1px solid #1e2633;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
        }

        .register-icon {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            background: #1a212b;
            border: 1px solid #2a3345;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-icon i {
            color: #00d4ff;
        }

        .form-label {
            color: #94a3b8;
        }

        .form-control {
            background: #0b0e14;
            border: 1px solid #1e2633;
            color: #c8d6e5;
        }

        .form-control::placeholder {
            color: #475569;
        }

        .form-control:focus {
            background: #0b0e14;
            color: #c8d6e5;
            border-color: #00d4ff;
            box-shadow: 0 0 0 0.2rem rgba(0, 212, 255, 0.15);
        }

        .btn-register {
            background: #00a3c4;
            border: 1px solid #00a3c4;
            color: #fff;
            border-radius: 10px;
            padding: 10px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-register:hover {
            background: #00b8d4;
            border-color: #00d4ff;
            color: #fff;
            transform: scale(1.02);
        }

        .register-footer a {
            color: #00d4ff;
        }

        .register-footer a:hover {
            color: #7ee8ff;
        }

        .alert-danger {
            background: #1a1012;
            border: 1px solid #991b1b;
            color: #fca5a5;
            border-radius: 10px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card register-card">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">
                            <div class="register-icon mx-auto mb-3">
                                <i class="fas fa-user-plus fs-4"></i>
                            </div>
                            <h1 class="h4 fw-light mb-1">Criar conta</h1>
                            <p class="small mb-0" style="color: #94a3b8;">Preencha os dados para se registrar</p>
                        </div>

                        <form action="{% url 'user:register' %}" method="post">
                            {% csrf_token %}

                            <div class="mb-3">
                                <label for="username" class="form-label small fw-semibold">Usuário</label>
                                <input type="text" class="form-control" id="username" name="username" placeholder="Escolha um usuário" required autofocus>
                            </div>

                            <div class="mb-3">
                                <label for="password1" class="form-label small fw-semibold">Senha</label>
                                <input type="password" class="form-control" id="password1" name="password1" placeholder="Crie uma senha" required>
                            </div>

                            <div class="mb-4">
                                <label for="password2" class="form-label small fw-semibold">Confirmar senha</label>
                                <input type="password" class="form-control" id="password2" name="password2" placeholder="Repita a senha" required>
                            </div>

                            {% for field in form %}
                                {% if field.errors %}
                                    <div class="alert alert-danger py-2">
                                        {{ field.errors }}
                                    </div>
                                {% endif %}
                            {% endfor %}

                            <button type="submit" class="btn btn-register w-100">
                                <i class="fas fa-check-circle me-2"></i>Criar conta
                            </button>

                            <p class="text-center small mt-4 mb-0 register-footer" style="color: #94a3b8;">
                                Já tem uma conta?
                                <a href="{% url 'user:login' %}" class="text-decoration-none fw-semibold">Entrar</a>
                            </p>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
