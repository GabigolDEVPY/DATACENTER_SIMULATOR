<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
        <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
        body {
            background: #0b0e14;
            color: #c8d6e5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .login-card {
            border-radius: 16px;
            background: #141a24;
            border: 1px solid #1e2633;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            max-width: 380px;
            width: 100%;
        }

        .login-icon {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            background: #1a212b;
            border: 1px solid #2a3345;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-icon i {
            color: #00d4ff;
        }

        .form-label {
            color: #94a3b8;
        }

        .form-control {
            background: #0b0e14;
            border: 1px solid #1e2633;
            color: #c8d6e5;
        }

        .form-control::placeholder {
            color: #475569;
        }

        .form-control:focus {
            background: #0b0e14;
            color: #c8d6e5;
            border-color: #00d4ff;
            box-shadow: 0 0 0 0.2rem rgba(0, 212, 255, 0.15);
        }

        .btn-login {
            background: #00a3c4;
            border: 1px solid #00a3c4;
            color: #fff;
            border-radius: 10px;
            padding: 10px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-login:hover {
            background: #00b8d4;
            border-color: #00d4ff;
            color: #fff;
            transform: scale(1.02);
        }

        .login-footer a {
            color: #00d4ff;
        }

        .login-footer a:hover {
            color: #7ee8ff;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">

    <div class="card login-card p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="login-icon mx-auto mb-3">
                <i class="fas fa-shield-alt fs-4"></i>
            </div>
            <h1 class="h4 fw-light mb-1">Entrar</h1>
            <p class="small mb-0" style="color: #94a3b8;">Acesse sua conta para continuar</p>
        </div>

        <form method="post" action="{% url 'user:login' %}">
            {% csrf_token %}

            <div class="mb-3">
                <label for="id_username" class="form-label small fw-semibold">Usuário</label>
                <input type="text" name="username" id="id_username" class="form-control" placeholder="Seu usuário" required autofocus>
            </div>

            <div class="mb-4">
                <label for="id_password" class="form-label small fw-semibold">Senha</label>
                <input type="password" name="password" id="id_password" class="form-control" placeholder="Sua senha" required>
            </div>

            <button type="submit" class="btn btn-login w-100">
                <i class="fas fa-sign-in-alt me-2"></i>Entrar
            </button>

            <p class="text-center small mt-4 mb-0 login-footer" style="color: #94a3b8;">
                Não tem uma conta?
                <a href="{% url 'user:register' %}" class="text-decoration-none fw-semibold">Criar conta</a>
            </p>
        </form>
    </div>

</body>
</html>
