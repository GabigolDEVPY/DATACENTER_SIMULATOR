{% extends "base.html" %}
{% load static %} 
 {% block content %}
 <link rel="stylesheet" href="{% static 'css/raritys.css' %}">
 <link rel="stylesheet" href="{% static 'css/styles.css' %}">
 <link rel="stylesheet" href="{% static 'css/modal_bay.css' %}">
<script src="{% static "scripts/scripts.js" %}"></script>


<div class="row col-24 mx-auto justify-content-center align-items-center">
    {% for hack in hacks %}
        {% include "partials/rack.html" %}

        {% if not forloop.last %}
            <div class="wire"></div>
        {% endif %}
    {% endfor %}
</div>

<div
  id="ModalBay"
  class="position-fixed top-0 start-0 w-100 h-100"
  style="display: none; z-index: 1050; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px);"
  onclick="if (event.target.id === 'ModalBay') closeModal();"
>
  <div
    class="position-relative bg-dark text-light border border-secondary rounded-3 p-4 mx-auto shadow-lg d-flex flex-column"
    style="max-width: 1100px; width: 95vw; max-height: 80vh; margin-top: 6vh; background-color: #0b0e14 !important; border-color: #1e2633 !important;"
  >
    <!-- Botão fechar (escuro) -->
    <button
      type="button"
      class="btn-close btn-close-white position-absolute top-0 end-0 m-3"
      aria-label="Close"
      onclick="closeModal()"
    ></button>

    <div
      id="ModalBayBody"
      class="flex-grow-1 text-light"
      style="color: #e8e4dc !important; overflow-y: auto; max-height: calc(80vh - 110px);"
    >
      <!-- conteúdo injetado pelo htmx -->
    </div>

    <div class="mt-auto d-flex justify-content-end pt-3 border-top border-secondary">
      <button type="button" class="btn btn-outline-light btn-sm" onclick="closeModal()">
        Fechar
      </button>
    </div>
  </div>
</div>

{% endblock content %}
